name: Release plugins
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugins to publish (All uses one combined release)
        type: choice
        options: [All, Roles, Items, Weapons, BetterCoinflips, ScpProximityChat, Core, SlFixes, RoundEvents]
        default: All
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: false
  push:
    branches: [main, 'release/**']
    tags: ['pb-*', 'roles-v*', 'items-v*', 'weapons-v*', 'bettercoinflips-v*', 'scpproximitychat-v*', 'core-v*', 'slfixes-v*', 'roundevents-v*']
  release:
    types: [published]
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
      bundle: ${{ steps.select.outputs.bundle }}
      tag: ${{ steps.select.outputs.tag }}
      existing_release: ${{ steps.select.outputs.existing_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate staff content coverage
        run: |
          python3 scripts/generate_catalog.py
          git diff --exit-code -- docs/CATALOG.md docs/ROLE_STATUS.md
      - id: select
        env:
          REQUESTED_PLUGIN: ${{ inputs.plugin || 'All' }}
        run: python scripts/select_release.py
  build:
    name: Build release ${{ matrix.plugin }}
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fetch_references.py
      - name: Build this plugin independently
        run: python scripts/build.py --plugin ${{ matrix.plugin }}
      - name: Run updater and gameplay regressions
        run: dotnet run --project tests/Brainless.Tests/Brainless.Tests.csproj -c Release
      - name: Validate release publication policy
        run: python -m unittest discover -s tests -p 'test_release_*.py'
      - name: Prepare DLL and checksum manifest
        id: prepare
        run: python scripts/prepare_release.py --plugin ${{ matrix.plugin }}
      - name: Verify actual assembly identity and version
        env:
          RELEASE_DLL: ${{ steps.prepare.outputs.dll }}
          ASSEMBLY_NAME: ${{ steps.prepare.outputs.assembly }}
          PLUGIN_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          dotnet run --project tests/Brainless.Tests/Brainless.Tests.csproj -c Release -- --verify-assembly "$RELEASE_DLL" "$ASSEMBLY_NAME" "$PLUGIN_VERSION"
          dotnet run --project tests/Brainless.Tests/Brainless.Tests.csproj -c Release -- --verify-native .
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.plugin }}
          path: artifacts/release/${{ matrix.plugin }}/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish release
    needs: [select, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.select.outputs.tag || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/staged
      - name: Publish the complete verified selection
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SELECTED_PLUGINS: ${{ needs.select.outputs.plugins }}
          BUNDLE: ${{ needs.select.outputs.bundle }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          EXISTING_RELEASE: ${{ needs.select.outputs.existing_release }}
          PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease || false }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          sys.path.insert(0, 'scripts')
          from prepare_release import PROJECTS, ROOT
          from publish_release import publish, publish_assets
          from publish_bundle import prepare_bundle
          assets = ROOT/'artifacts/staged'
          existing = os.environ['EXISTING_RELEASE'] == 'true'
          prerelease = os.environ['PRERELEASE'] == 'true'
          tag = os.environ['RELEASE_TAG']
          try:
              if os.environ['BUNDLE'] == 'true':
                  files, notes = prepare_bundle(assets, ROOT/'artifacts/combined', os.environ['GH_REPO'])
                  publish_assets(files, tag, 'Project Brainless — All Plugins', notes, existing, prerelease, latest=True)
              else:
                  plugin, = json.loads(os.environ['SELECTED_PLUGINS'])
                  assembly, project = PROJECTS[plugin]
                  version = ET.parse(ROOT/project).findtext('.//Version')
                  expected_tag = plugin.lower()+'-v'+version
                  if tag and tag != expected_tag:
                      raise ValueError('Component release tag must match the project version.')
                  dll, = assets.rglob(assembly+'.dll')
                  manifest, = assets.rglob(assembly+'.update.json')
                  publish(plugin, version, dll, manifest, tag or expected_tag, existing, prerelease)
          except subprocess.CalledProcessError as error:
              raise SystemExit(f'GitHub release command failed with exit code {error.returncode}; published assets were not clobbered.')
          PY
